name: ci

# Tests, lint and shared-core parity on every PR and push to main.
# `--no-project` on purpose: the project's own deps pull PyGObject, which builds
# from source and needs apt libs. The tests stub gi/cairo (see tests/conftest.py)
# so CI stays a plain interpreter + pytest.
# pytest-timeout is pulled in because pyproject.toml sets `timeout = 60`: without
# the plugin the key is silently ignored and a hung stop() burns the whole job.

on:
  push:
    branches: [main, master, develop, trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The remote-sessions core is carried verbatim by the TUI, and
      # tests/test_core_parity.py checks it symbol by symbol. Without this
      # checkout the test FAILS (CI is set) rather than skipping: a guard that
      # never runs guards nothing.
      #
      # The SAME checkout exists mirrored in the TUI repo, and it has to: while
      # the guard lived here only, a core change landing as a TUI-only PR went
      # green over there and later reddened an unrelated GTK PR — blaming the
      # wrong author.
      #
      # Branch-to-branch when the same branch exists on both sides (a shared-core
      # change lands as one branch name in two repos), default branch otherwise.
      # Corollary, and it is an ORDERING CONSTRAINT, not a bug: a core change is
      # only green here once its twin is pushed to the TUI repo.
      #
      # The revision is RESOLVED FIRST, then checked out ONCE. The previous shape
      # — try the branch with continue-on-error, then a fallback step — broke as
      # soon as the twin branch was merged and deleted: the failed attempt left
      # `_tui` as a non-repository, and the fallback died on `git reset --hard
      # HEAD` there, so the parity guard compared against an empty module and
      # reported every shared symbol as missing. Same resolution as webui's.
      #
      # A PR from a fork pushes its twin to the same fork, never here: the twin
      # is looked up in the PR author's fork first (assumed to keep the repo
      # name), then here. Looking here only compared a fork PR against the
      # pre-change TUI, so a shared-core change from a fork was red on both
      # sides until one side was merged red.
      #
      # Branch and fork owner go through env, not inline `${{ }}`: a fork PR's
      # branch name is attacker-controlled and would be spliced into the script.
      - name: Resolve the TUI revision
        id: sibling
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.owner.login || '' }}
        run: |
          set -euo pipefail
          repo="claude-watcher/tui"
          ref=""
          for owner in ${FORK_OWNER:+"$FORK_OWNER"} claude-watcher; do
            if git ls-remote --exit-code --heads \
                 "https://github.com/$owner/tui.git" "$BRANCH" >/dev/null 2>&1; then
              repo="$owner/tui"
              ref="$BRANCH"
              break
            fi
          done
          echo "tui=$repo@${ref:-<default branch>}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the TUI (shared core)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.sibling.outputs.repo }}
          ref: ${{ steps.sibling.outputs.ref }}
          path: _tui

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pytest
        run: uv run --no-project --with pytest --with pytest-timeout pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # THE SAME command as the local hook, not a replay of two of its steps:
      # replaying only ruff and mypy let the other six hooks through (end of file,
      # trailing whitespace, YAML/TOML, private key, shebangs) for a contributor
      # without pre-commit installed. The TUI diagnosed exactly this and fixed it
      # there; this job shipped the version it had diagnosed as bad.
      - name: Pre-commit
        run: uvx pre-commit@4.4.0 run --all-files --show-diff-on-failure
